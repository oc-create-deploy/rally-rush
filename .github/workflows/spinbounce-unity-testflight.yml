name: SpinBounce Unity TestFlight

on:
  workflow_dispatch:

concurrency:
  group: spinbounce-unity-testflight
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  build-ios:
    defaults:
      run:
        working-directory: app/Unity
    name: Licensed Unity iOS export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_NO_CONSENT_PROMPT: "1"
      UNITY_BROWSER_STORAGE_STATE: ${{ secrets.UNITY_BROWSER_STORAGE_STATE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: oc-create-deploy/SpinBounce3D
          ref: 752c390fdbe0ed5469d1eb3f05f858b915c51208
          ssh-key: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: app

      - name: Free disk space for Unity and iOS support
        shell: bash
        run: |
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL; do
            if [ -d "$path" ]; then
              sudo find "$path" -mindepth 1 -delete
            fi
          done
          docker system prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Unity CLI
        shell: bash
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          "$HOME/.local/bin/unity" --version

      - name: Install browser authorization helper
        timeout-minutes: 8
        shell: bash
        run: |
          helper_dir="$RUNNER_TEMP/spin-unity-browser-helper"
          mkdir -p "$helper_dir"
          npm install --prefix "$helper_dir" --no-audit --no-fund playwright@1.55.0
          "$helper_dir/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$helper_dir/node_modules" >> "$GITHUB_ENV"

      - name: Sign in to Unity automatically
        shell: bash
        run: |
          state_file="$RUNNER_TEMP/unity-browser-state.json"
          STATE_FILE="$state_file" node -e 'require("fs").writeFileSync(process.env.STATE_FILE, process.env.UNITY_BROWSER_STORAGE_STATE, { mode: 0o600 })'

          login_log="$RUNNER_TEMP/unity-auth.log"
          "$HOME/.local/bin/unity" auth login --format human >"$login_log" 2>&1 &
          login_pid=$!
          trap 'kill "$login_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            sign_in_url=$(grep -Eo 'https://services\.api\.unity\.com/app-linking/[^[:space:]]+' "$login_log" | head -1 || true)
            if [ -n "$sign_in_url" ]; then
              break
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              wait "$login_pid"
            fi
            sleep 1
          done

          test -n "${sign_in_url:-}"
          node ../.github/scripts/unity-browser-authorize.js "$state_file" "$sign_in_url" &
          browser_pid=$!
          wait "$login_pid"
          wait "$browser_pid"
          trap - EXIT
          "$HOME/.local/bin/unity" auth status --format json

      - name: Activate Unity Personal
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license activate --personal --accept-eula --format json

      - name: Verify license
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license status --format json

      - name: Install Unity Editor and iOS module
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" install 2022.3.62f1
          -c 4af31df58517
          -m ios
          --format github

      - name: Export Xcode project
        env:
          UNITY_IOS_SIMULATOR: false
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" build .
          --editor-version 2022.3.62f1
          --target iOS
          --execute-method BuildScript.BuildIos
          --timeout 3600
          --format github

      - name: Encrypt private Xcode export
        env:
          EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
        run: |
          cp -R ../.github/scripts build/iOS/qa
          tar -czf "$RUNNER_TEMP/export.tar.gz" -C build/iOS .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/export.tar.gz" -out "$RUNNER_TEMP/spin-export.enc" -pass env:EXPORT_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: spinbounce-encrypted-export
          path: ${{ runner.temp }}/spin-export.enc
          retention-days: 1
          if-no-files-found: error
  release:
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_BUNDLE_ID: com.spin.bounce
      KEYCHAIN_PASSWORD: temporary-spinbounce-keychain-password
    defaults:
      run:
        working-directory: app
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: spinbounce-encrypted-export
        path: encrypted
    - name: Decrypt device export
      env:
        EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
      run: |-
        mkdir -p app
        openssl enc -d -aes-256-cbc -pbkdf2 -in encrypted/spin-export.enc -out "$RUNNER_TEMP/export.tar.gz" -pass env:EXPORT_PASSWORD
        tar -xzf "$RUNNER_TEMP/export.tar.gz" -C app
      working-directory: .
    - name: Resolve native dependencies and build unsigned device app
      run: |-
        pod install --repo-update
        xcodebuild -workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/native" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcode.log" 2>&1 || { tail -100 "$RUNNER_TEMP/xcode.log"; exit 1; }
    - name: Verify App Store destination and create provisioning profile
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: |
        CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
        PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
        printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
  
        if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem"; then
          openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/distribution.pem"
        fi
        export CERTIFICATE_SERIAL=$(openssl x509 -in "$RUNNER_TEMP/distribution.pem" -noout -serial | cut -d= -f2)
        export CERTIFICATE_PATH PROFILE_PATH
        echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
        echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
  
        python3 -m venv "$RUNNER_TEMP/asc-venv"
        "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet pyjwt cryptography
        "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
        import base64
        import json
        import os
        import time
        import urllib.error
        import urllib.parse
        import urllib.request
  
        import jwt
  
        def make_token():
            now = int(time.time())
            return jwt.encode(
                {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                os.environ["ASC_PRIVATE_KEY"],
                algorithm="ES256",
                headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
            )
  
        def request(method, path, body=None):
            data = json.dumps(body).encode() if body is not None else None
            req = urllib.request.Request(
                "https://api.appstoreconnect.apple.com" + path,
                data=data,
                method=method,
                headers={"Authorization": f"Bearer {make_token()}", "Content-Type": "application/json"},
            )
            try:
                with urllib.request.urlopen(req) as response:
                    return json.load(response)
            except urllib.error.HTTPError as error:
                detail = error.read().decode()
                raise RuntimeError(f"App Store Connect {method} {path} failed ({error.code}): {detail}") from error
  
        identifier = urllib.parse.quote(os.environ["APP_BUNDLE_ID"], safe="")
        apps = request("GET", f"/v1/apps?filter%5BbundleId%5D={identifier}&limit=2").get("data", [])
        if len(apps) != 1:
            raise RuntimeError(f"Expected one App Store app for {os.environ['APP_BUNDLE_ID']}, found {len(apps)}")
        app_id = apps[0]["id"]
        print(f"Confirmed App Store app: {apps[0]['attributes']['name']} ({app_id})")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"APP_STORE_APP_ID={app_id}\n")
  
        existing = request("GET", f"/v1/builds?filter%5Bapp%5D={app_id}&filter%5Bversion%5D=55&limit=1").get("data", [])
        if existing:
            raise RuntimeError("Build 55 already exists; refuse duplicate upload")
  
        bundle_records = request("GET", f"/v1/bundleIds?filter%5Bidentifier%5D={identifier}&limit=2").get("data", [])
        if len(bundle_records) != 1:
            raise RuntimeError(f"Expected one bundle ID record for {os.environ['APP_BUNDLE_ID']}")
        bundle_id = bundle_records[0]["id"]
  
        certificates = request("GET", "/v1/certificates?limit=200").get("data", [])
        wanted_serial = os.environ["CERTIFICATE_SERIAL"].upper().lstrip("0")
        certificate = next(
            (
                item for item in certificates
                if str(item.get("attributes", {}).get("serialNumber", "")).upper().lstrip("0") == wanted_serial
                and item.get("attributes", {}).get("certificateType") in {"IOS_DISTRIBUTION", "DISTRIBUTION"}
            ),
            None,
        )
        if certificate is None:
            raise RuntimeError("The installed distribution certificate was not found in App Store Connect")
  
        profile_name = f"SpinBounce3D App Store {os.environ['GITHUB_RUN_ID']}"
        profile = request(
            "POST",
            "/v1/profiles",
            {
                "data": {
                    "type": "profiles",
                    "attributes": {"name": profile_name, "profileType": "IOS_APP_STORE"},
                    "relationships": {
                        "bundleId": {"data": {"type": "bundleIds", "id": bundle_id}},
                        "certificates": {"data": [{"type": "certificates", "id": certificate["id"]}]},
                    },
                }
            },
        )["data"]
        content = profile.get("attributes", {}).get("profileContent")
        if not content:
            raise RuntimeError("App Store Connect returned a profile without profileContent")
        with open(os.environ["PROFILE_PATH"], "wb") as output:
            output.write(base64.b64decode(content))
        print(f"Created provisioning profile: {profile_name}")
        PY
    - name: Install signing identity and profile
      env:
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
  
        security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
        PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
        PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
        TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
        export PROFILE_NAME TEAM_ID
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
  
        echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
        echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
    - name: Create App Store export options
      run: |
        python3 - <<'PY'
        import os
        import plistlib
  
        options = {
            "destination": "export",
            "manageAppVersionAndBuildNumber": False,
            "method": "app-store-connect",
            "provisioningProfiles": {os.environ["APP_BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
            "signingCertificate": "Apple Distribution",
            "signingStyle": "manual",
            "stripSwiftSymbols": True,
            "teamID": os.environ["APPLE_TEAM_ID"],
            "uploadSymbols": True,
        }
        with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
            plistlib.dump(options, output)
        PY
    - name: Configure signing only on main app target
      run: |-
        ruby - <<'RUBY'
        require 'xcodeproj'
        p = Xcodeproj::Project.open('Unity-iPhone.xcodeproj')
        p.targets.each do |t|
          t.build_configurations.each do |c|
            c.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings.keys.grep(/\ACODE_SIGN_IDENTITY(?:\[|\z)/).each { |key| c.build_settings.delete(key) }
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            if t.name == 'Unity-iPhone'
              c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            else
              c.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
          end
        end
        p.save
        RUBY
    - name: Archive and export signed Unity IPA
      run: |-
        xcodebuild -workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release -destination generic/platform=iOS -archivePath build/SpinBounce3D.xcarchive CODE_SIGN_IDENTITY="Apple Distribution" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -100 "$RUNNER_TEMP/archive.log"; exit 1; }
        python3 -c "import glob,plistlib; p=plistlib.load(open(glob.glob('build/SpinBounce3D.xcarchive/Products/Applications/*.app/Info.plist')[0],'rb')); assert p['CFBundleIdentifier']=='com.spin.bounce' and p['CFBundleVersion']=='55' and p['UIDeviceFamily']==[1]"
        xcodebuild -exportArchive -archivePath build/SpinBounce3D.xcarchive -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
    - name: Upload to TestFlight
      working-directory: app
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: |
        PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
        mkdir -p "$PRIVATE_KEYS_DIR"
        printf '%s' "$ASC_PRIVATE_KEY" > "$PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
        IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
        test -n "$IPA_PATH"
        xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
    - name: Wait for Apple processing
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        EXPECTED_BUILD_NUMBER: '55'
      run: |
        "$RUNNER_TEMP/asc-venv/bin/python" - <<'PY'
        import json
        import os
        import time
        import urllib.parse
        import urllib.request
  
        import jwt
  
        def make_token():
            now = int(time.time())
            return jwt.encode(
                {"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
                os.environ["ASC_PRIVATE_KEY"],
                algorithm="ES256",
                headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
            )
  
        params = urllib.parse.urlencode({
            "filter[app]": os.environ["APP_STORE_APP_ID"],
            "filter[version]": os.environ["EXPECTED_BUILD_NUMBER"],
            "limit": 1,
        })
        deadline = time.time() + 2400
        while time.time() < deadline:
            req = urllib.request.Request(
                "https://api.appstoreconnect.apple.com/v1/builds?" + params,
                headers={"Authorization": f"Bearer {make_token()}"},
            )
            with urllib.request.urlopen(req) as response:
                builds = json.load(response).get("data", [])
            if builds:
                attributes = builds[0]["attributes"]
                state = attributes.get("processingState")
                compliance = attributes.get("usesNonExemptEncryption")
                print(f"Apple processing state: {state}; usesNonExemptEncryption={compliance}", flush=True)
                if state == "VALID" and compliance is False:
                    raise SystemExit(0)
                if state in {"FAILED", "INVALID"}:
                    raise RuntimeError(f"Apple processing ended in {state}")
            time.sleep(30)
        raise TimeoutError("Apple did not finish processing within 40 minutes")
        PY
