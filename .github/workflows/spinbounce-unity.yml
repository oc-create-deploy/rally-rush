name: SpinBounce Unity native validation

on:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read-only Darwin host diagnostics; no Unity export or gameplay
        type: boolean
        required: false
        default: false
      simulator:
        description: Export for iOS Simulator screenshot capture
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  statuses: write

jobs:
  build-ios:
    if: ${{ !inputs.diagnostics_only }}
    defaults:
      run:
        working-directory: app/Unity
    name: Licensed Unity iOS export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_NO_CONSENT_PROMPT: "1"
      UNITY_BROWSER_STORAGE_STATE: ${{ secrets.UNITY_BROWSER_STORAGE_STATE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: oc-create-deploy/SpinBounce3D
          ref: 56a55f59e4860e6f9d705ab5dd7d73c9489e1781
          ssh-key: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: app

      - name: Free disk space for Unity and iOS support
        shell: bash
        run: |
          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL; do
            if [ -d "$path" ]; then
              sudo find "$path" -mindepth 1 -delete
            fi
          done
          docker system prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Unity CLI
        shell: bash
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          "$HOME/.local/bin/unity" --version

      - name: Install browser authorization helper
        timeout-minutes: 8
        shell: bash
        run: |
          helper_dir="$RUNNER_TEMP/spin-unity-browser-helper"
          mkdir -p "$helper_dir"
          npm install --prefix "$helper_dir" --no-audit --no-fund playwright@1.55.0
          "$helper_dir/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$helper_dir/node_modules" >> "$GITHUB_ENV"

      - name: Sign in to Unity automatically
        shell: bash
        run: |
          state_file="$RUNNER_TEMP/unity-browser-state.json"
          STATE_FILE="$state_file" node -e 'require("fs").writeFileSync(process.env.STATE_FILE, process.env.UNITY_BROWSER_STORAGE_STATE, { mode: 0o600 })'

          login_log="$RUNNER_TEMP/unity-auth.log"
          "$HOME/.local/bin/unity" auth login --format human >"$login_log" 2>&1 &
          login_pid=$!
          trap 'kill "$login_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            sign_in_url=$(grep -Eo 'https://services\.api\.unity\.com/app-linking/[^[:space:]]+' "$login_log" | head -1 || true)
            if [ -n "$sign_in_url" ]; then
              break
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              wait "$login_pid"
            fi
            sleep 1
          done

          test -n "${sign_in_url:-}"
          node ../.github/scripts/unity-browser-authorize.js "$state_file" "$sign_in_url" &
          browser_pid=$!
          wait "$login_pid"
          wait "$browser_pid"
          trap - EXIT
          "$HOME/.local/bin/unity" auth status --format json

      - name: Activate Unity Personal
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license activate --personal --accept-eula --format json

      - name: Verify license
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license status --format json

      - name: Install Unity Editor and iOS module
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" install 2022.3.62f1
          -c 4af31df58517
          -m ios
          --format github

      - name: Export Xcode project
        env:
          UNITY_IOS_SIMULATOR: ${{ inputs.simulator }}
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" build .
          --editor-version 2022.3.62f1
          --target iOS
          --execute-method BuildScript.BuildIos
          --timeout 3600
          --format github

      - name: Encrypt private Xcode export
        env:
          EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
        run: |
          cp -R ../.github/scripts build/iOS/qa
          tar -czf "$RUNNER_TEMP/export.tar.gz" -C build/iOS .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/export.tar.gz" -out "$RUNNER_TEMP/spin-export.enc" -pass env:EXPORT_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: spinbounce-encrypted-export
          path: ${{ runner.temp }}/spin-export.enc
          retention-days: 1
          if-no-files-found: error
  native-validation:
    needs: build-ios
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Verify alternate simulator host compatibility
        if: inputs.simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/preflight-devices.json"
          python3 - <<'PYTHON'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/preflight-devices.json'))
          devices = data['devices'].get('com.apple.CoreSimulator.SimRuntime.iOS-26-2', [])
          assert any(d.get('isAvailable') and 'iPhone' in d['name'] for d in devices), 'Required iOS26.2 iPhone unavailable'
          PYTHON
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned native gesture driver
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
      - uses: actions/download-artifact@v4
        with:
          name: spinbounce-encrypted-export
          path: encrypted
      - name: Decrypt private source export
        env:
          EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p app
          openssl enc -d -aes-256-cbc -pbkdf2 -in encrypted/spin-export.enc -out "$RUNNER_TEMP/export.tar.gz" -pass env:EXPORT_PASSWORD
          tar -xzf "$RUNNER_TEMP/export.tar.gz" -C app
      - uses: actions/setup-python@v5
        if: inputs.simulator
        with:
          python-version: '3.14'
      - name: Install checksum-pinned experimental HID transport
        if: inputs.simulator
        run: python3 app/qa/install-idb.py
      - name: Resolve native AdMob dependencies
        working-directory: app
        run: pod install --repo-update
      - name: Build native Unity application
        working-directory: app
        run: |
          if [ "${{ inputs.simulator }}" = "true" ]; then
            destination='generic/platform=iOS Simulator'
          else
            destination='generic/platform=iOS'
          fi
          xcodebuild -workspace Unity-iPhone.xcworkspace -scheme Unity-iPhone -configuration Release -destination "$destination" -derivedDataPath "$RUNNER_TEMP/native" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcode.log" 2>&1 || { tail -100 "$RUNNER_TEMP/xcode.log"; exit 1; }
      - name: Boot native simulator and inspect process
        if: inputs.simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          DEVICE=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); print(next(v["udid"] for k,vs in d["devices"].items() if k == "com.apple.CoreSimulator.SimRuntime.iOS-26-2" for v in vs if "iPhone" in v["name"] and v.get("isAvailable", False)))')
          echo "UDID=$DEVICE" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 -c 'import json,os,time,pathlib; p=pathlib.Path(os.environ['"'"'RUNNER_TEMP'"'"'])/'"'"'evidence'"'"'/'"'"'recording-phases.jsonl'"'"'; p.open('"'"'a'"'"').write(json.dumps(dict(phase='"'"'simulator_boot_start'"'"',monotonic=time.monotonic(),utc=time.time()))+'"'"'\n'"'"')'
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          python3 -c 'import json,os,time,pathlib; p=pathlib.Path(os.environ['"'"'RUNNER_TEMP'"'"'])/'"'"'evidence'"'"'/'"'"'recording-phases.jsonl'"'"'; p.open('"'"'a'"'"').write(json.dumps(dict(phase='"'"'simulator_bootstatus_complete'"'"',monotonic=time.monotonic(),utc=time.time()))+'"'"'\n'"'"')'
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          def phase(name, **details):
              with (evidence / 'recording-phases.jsonl').open('a') as journal:
                  journal.write(json.dumps(dict(phase=name, monotonic=time.monotonic(), utc=time.time(), **details)) + '\n')
          """Local-only bounded companion ownership; integration pending review."""
          import subprocess
          import json
          import time


          def with_companion(command, baseline, log, popen=subprocess.Popen):
              child = popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  return baseline()
              finally:
                  early_status = child.poll()
                  cleanup = "already_exited"
                  if early_status is None:
                      cleanup = "terminated"
                      child.terminate()
                      try:
                          child.wait(timeout=3)
                      except subprocess.TimeoutExpired:
                          cleanup = "killed_after_timeout"
                          child.kill()
                          child.wait(timeout=3)
                  else:
                      child.wait(timeout=3)
                  if log is not None:
                      log.write(json.dumps(dict(event="companion_cleanup", utc=time.time(),
                                                early_exit_status=early_status,
                                                final_exit_status=child.poll(), cleanup=cleanup)) + "\n")
                      log.flush()
          phase('pre_launch_baseline_start', requested_interval_seconds=1.0, duration_seconds=180.0, purpose='bounded_preinstall_resource_stability_not_gameplay_acceptance')
          def baseline():
              with (evidence / 'pre-launch-collector.log').open('x') as log:
                  try:
                      result = subprocess.run([sys.executable, '-c', 'import types,sys\npolicy=types.ModuleType(\'stability_policy\')\nexec(\'"""LOCAL ONLY: host readiness experiment, not gameplay acceptance/recovery.\\n\\n180s maximum from bootstatus; require five consecutive fresh CPU/wake\\nintervals. Timeout must abort before install, preserve encrypted diagnostics.\\nAn outer subprocess timeout is still required for a blocked collector.\\n"""\\nimport math\\n\\n\\ndef finite(value):\\n    return type(value) in (int, float) and math.isfinite(value)\\n\\n\\nclass Stability:\\n    def __init__(self, start):\\n        self.start = start\\n        self.previous = None\\n        self.streak = 0\\n\\n    def sample(self, now, row):\\n        if not finite(now) or not finite(self.start) or not 0 <= now-self.start < 180:\\n            self.streak = 0\\n            return \\\'timeout\\\'\\n        if not isinstance(row, dict) or not isinstance(row.get(\\\'cpu\\\'), dict):\\n            self.previous = None\\n            self.streak = 0\\n            return \\\'waiting\\\'\\n        cpu = row[\\\'cpu\\\']\\n        old = self.previous\\n        self.previous = (now, cpu.copy())\\n        ticks = cpu.get(\\\'tickDelta\\\')\\n        start, end = cpu.get(\\\'readStart\\\'), cpu.get(\\\'readEnd\\\')\\n        valid = (old is not None and finite(start) and finite(end)\\n                 and 0 <= now-end <= .1 and 0 <= end-start <= .1\\n                 and cpu.get(\\\'baselineReadEnd\\\') == old[1].get(\\\'readEnd\\\')\\n                 and finite(cpu.get(\\\'baselineReadEnd\\\'))\\n                 and .5 <= start-cpu[\\\'baselineReadEnd\\\'] <= 1.5\\n                 and .5 <= now-old[0] <= 1.5\\n                 and cpu.get(\\\'valid\\\') is True\\n                 and isinstance(ticks, list) and len(ticks) == 4\\n                 and all(type(t) is int and t >= 0 for t in ticks)\\n                 and sum(ticks) > 0 and finite(cpu.get(\\\'idleFraction\\\'))\\n                 and abs(cpu[\\\'idleFraction\\\']-ticks[2]/sum(ticks)) < 1e-9\\n                 and .1 <= cpu[\\\'idleFraction\\\'] <= 1\\n                 and finite(row.get(\\\'wakeLateness\\\'))\\n                 and 0 <= row[\\\'wakeLateness\\\'] <= .1)\\n        self.streak = self.streak+1 if valid else 0\\n        return \\\'ready\\\' if self.streak >= 5 else \\\'waiting\\\'\\n\',policy.__dict__)\n"""LOCAL ONLY: bounded fail-closed readiness collector; outer timeout required."""\nimport importlib.util\nimport json\nimport pathlib\nimport time\n\n\ndef load(path, name):\n    spec = importlib.util.spec_from_file_location(name, path)\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    return module\n\n\ndef collect(output, host, policy, clock=time.monotonic, sleep=time.sleep):\n    start = clock()\n    gate = policy.Stability(start)\n    deadline = start + 180\n    target = start\n    with open(output, \'x\') as stream:\n        while True:\n            sleep(max(0, min(target, deadline) - clock()))\n            woke = clock()\n            if woke >= deadline:\n                stream.write(json.dumps(dict(event=\'timeout\', monotonic=woke)) + \'\\n\')\n                stream.flush()\n                return 124\n            row = dict(cpu=host.sample(), wakeLateness=max(0, woke-target))\n            now = clock()\n            decision = gate.sample(now, row)\n            stream.write(json.dumps(dict(event=\'sample\', monotonic=now,\n                elapsed=now-start, decision=decision, streak=gate.streak,\n                **row), allow_nan=False) + \'\\n\')\n            stream.flush()\n            if decision == \'ready\':\n                return 0\n            if decision == \'timeout\':\n                return 124\n            # No catch-up burst following an overdue wake/read.\n            target = max(target + 1, now + 1)\n\n\n\nhost=load(\'app/qa/native-host-diagnostics.py\',\'host_diagnostics\').HostDiagnostics()\nsys.exit(collect(sys.argv[1],host,policy))\n', str(evidence / 'pre-install-stability.jsonl')], stdout=log, stderr=subprocess.STDOUT, timeout=195)
                      code = result.returncode
                  except subprocess.TimeoutExpired:
                      log.write('Bounded baseline timed out; no native success claimed\n')
                      code = 124
              return code
          with (evidence / 'pre-launch-process-collector.log').open('x') as process_log:
              code = with_companion([sys.executable, '-c', '"""LOCAL diagnostic companion; never an admission gate or causal attribution."""\nimport json\nimport subprocess\nimport time\n\n\ndef observe(run=subprocess.run, clock=time.monotonic, utc=time.time):\n    start, stamp = clock(), utc()\n    try:\n        # comm excludes arguments/environment; no credential-bearing command lines.\n        result = run([\'ps\', \'-axo\', \'pid=,ppid=,%cpu=,comm=\'],\n                     capture_output=True, text=True, timeout=2, check=False)\n        rows = []\n        if result.returncode == 0:\n            for line in result.stdout.splitlines():\n                parts = line.split(None, 3)\n                if len(parts) != 4:\n                    continue\n                try:\n                    pid, parent, cpu = int(parts[0]), int(parts[1]), float(parts[2])\n                except ValueError:\n                    continue\n                rows.append(dict(pid=pid, parent=parent, smoothedCpuPercent=cpu,\n                                 executable=parts[3]))\n        return dict(start=start, end=clock(), utc=stamp, status=result.returncode,\n                    processes=sorted(rows, key=lambda r:r[\'smoothedCpuPercent\'], reverse=True)[:20],\n                    limitation=\'smoothed process CPU; temporal correlation only, not causal attribution\')\n    except subprocess.TimeoutExpired:\n        return dict(start=start, end=clock(), utc=stamp, status=\'timeout\', processes=[])\n\n\nif __name__ == \'__main__\':\n    import sys\n    # Companion intended to share the readiness collector\'s 180s window, owned by outer195s bound.\n    end = time.monotonic() + 195\n    with open(sys.argv[1], \'x\') as output:\n        while time.monotonic() < end:\n            output.write(json.dumps(observe(), allow_nan=False) + \'\\n\')\n            output.flush()\n            time.sleep(min(2, max(0, end-time.monotonic())))\n', str(evidence / 'pre-launch-processes.jsonl')], baseline, process_log)
          phase('pre_launch_baseline_end')
          sys.exit(code)
          PYTHON
          APP=$(find "$RUNNER_TEMP/native/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          xcrun simctl install "$DEVICE" "$APP"
          # Synchronous launch exposes launch errors/PID; console-pty may block before launch.
          xcrun simctl launch "$DEVICE" com.spin.bounce > "$RUNNER_TEMP/launch.log" 2>&1 || { cat "$RUNNER_TEMP/launch.log"; exit 1; }
          sleep 25
          xcrun simctl spawn "$DEVICE" launchctl list > "$RUNNER_TEMP/processes.log"
          if ! grep com.spin.bounce "$RUNNER_TEMP/processes.log"; then
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "SpinBounce3D" OR eventMessage CONTAINS "com.spin.bounce"' > "$RUNNER_TEMP/runtime.log" 2>&1 || true
            exit 1
          fi
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/smoke.png"
          if grep -E 'NullReferenceException|MissingMethodException|DllNotFoundException|Shader.*not found' "$RUNNER_TEMP/launch.log"; then exit 1; fi
      - name: Real native gameplay gestures, pause and persistence checks
        if: inputs.simulator
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
          MAESTRO_CLI_NO_ANALYTICS: 'true'
          MAESTRO_DISABLE_UPDATE_CHECK: 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          # Bounded unrecorded host baseline; no gestures or admission relaxation.
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          def phase(name, **details):
              with (evidence / 'recording-phases.jsonl').open('a') as journal:
                  journal.write(json.dumps(dict(phase=name, monotonic=time.monotonic(), utc=time.time(), **details)) + '\n')
          phase('pre_record_baseline_start', requested_interval_seconds=1.0, duration_seconds=30.0, purpose='noncausal_unrecorded_host_diagnostic')
          with (evidence / 'pre-record-collector.log').open('x') as log:
              try:
                  result = subprocess.run([sys.executable, '-c', "import importlib.util,sys; s=importlib.util.spec_from_file_location('collector','app/qa/collect-host-diagnostics.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); n,v=m.collect(sys.argv[1],duration=30.0,interval=1.0); sys.exit(0 if sys.platform=='darwin' and v>0 else 2)", str(evidence / 'pre-record-host.jsonl')], stdout=log, stderr=subprocess.STDOUT, timeout=45)
                  code = result.returncode
              except subprocess.TimeoutExpired:
                  log.write('Bounded baseline timed out; no native success claimed\n')
                  code = 124
          phase('pre_record_baseline_end')
          sys.exit(code)
          PYTHON
          python3 - <<'PYTHON'
          import json, os, pathlib, signal, subprocess, sys, time
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence'
          def phase(name, **details):
              with (evidence / 'recording-phases.jsonl').open('a') as journal:
                  journal.write(json.dumps(dict(phase=name, monotonic=time.monotonic(), utc=time.time(), **details)) + '\n')
          recorder = subprocess.Popen(['xcrun', 'simctl', 'io', os.environ['UDID'], 'recordVideo', '--codec=h264', '--force', str(evidence / 'gameplay.mov')])
          code = 1
          clean = False
          try:
              phase('recording_process_spawned_not_ready_proof', pid=recorder.pid)
              if recorder.poll() is not None:
                  phase('recording_exited_before_gameplay', recorder_exit=recorder.returncode)
                  raise RuntimeError('Recorder exited before gameplay; no video acceptance')
              code = subprocess.run([sys.executable, 'app/qa/run-idb-qa.py']).returncode
              if recorder.poll() is not None:
                  phase('recording_exited_during_gameplay', recorder_exit=recorder.returncode)
                  raise RuntimeError('Recorder exited during gameplay; continuous video unproven')
          finally:
              try:
                  recorder.send_signal(signal.SIGINT)
                  recorder.wait(timeout=15)
                  clean = recorder.returncode == 0
              except subprocess.TimeoutExpired:
                  recorder.kill()
                  try:
                      recorder.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      phase('recording_cleanup_failed_after_kill')
                      raise
                  phase('recording_cleanup_forced_kill')
              except ProcessLookupError:
                  recorder.wait(timeout=5)
              phase('recording_cleanup_end', recorder_exit=recorder.returncode, clean=clean)
          sys.exit(code if code else (0 if clean else 1))
          PYTHON
      - name: Real hosted StoreKit purchase and deferred integration
        if: inputs.simulator
        timeout-minutes: 25
        working-directory: app
        run: |
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/evidence/storekit-runtimes.json"
          xcrun simctl list devices -j > "$RUNNER_TEMP/evidence/storekit-devices.json"
          ruby -c qa/storekit/configure.rb
          ruby qa/storekit/configure.rb
          python3 qa/storekit/cancel-sheet.py &
          CANCEL_DRIVER=$!
          trap 'kill "$CANCEL_DRIVER" 2>/dev/null || true' EXIT
          xcodebuild -workspace Unity-iPhone.xcworkspace -scheme SpinStoreTests -configuration Release -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/native" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO test > "$RUNNER_TEMP/evidence/storekit-tests.log" 2>&1 || { echo 'Hosted StoreKit integration failed; inspect encrypted private log'; exit 1; }
          wait "$CANCEL_DRIVER"
      - name: Verify purchased ammo and dedup receipts survive cold launch
        if: inputs.simulator
        working-directory: app
        run: python3 qa/storekit/cold-purchase.py
      - name: Encrypt validation evidence
        if: always()
        env:
          EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          for f in xcode.log launch.log processes.log runtime.log smoke.png; do
            if [ -f "$RUNNER_TEMP/$f" ]; then cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/evidence/"; fi
          done
          tar -czf "$RUNNER_TEMP/evidence.tar.gz" -C "$RUNNER_TEMP/evidence" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/evidence.tar.gz" -out "$RUNNER_TEMP/evidence.enc" -pass env:EXPORT_PASSWORD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinbounce-encrypted-validation
          path: ${{ runner.temp }}/evidence.enc
          retention-days: 1

  host-diagnostics:
    if: inputs.diagnostics_only
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: oc-create-deploy/SpinBounce3D
          ref: e038d9ad4ff26d3f09d2290670d0f0834dca4699
          ssh-key: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
          path: app
      - name: Bounded read-only CPU and wake diagnostics
        timeout-minutes: 2
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 - <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'evidence'
          with (output / 'collector.log').open('x') as log:
              try:
                  result = subprocess.run([sys.executable, 'app/.github/scripts/collect-host-diagnostics.py', str(output / 'host.jsonl')], stdout=log, stderr=subprocess.STDOUT, timeout=45)
              except subprocess.TimeoutExpired:
                  log.write('Collector exceeded45s wall timeout; no native success claimed\n')
                  raise SystemExit(124)
          raise SystemExit(result.returncode)
          PYTHON
      - name: Encrypt diagnostic evidence
        if: always()
        env:
          EXPORT_PASSWORD: ${{ secrets.SPINBOUNCE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          tar -czf "$RUNNER_TEMP/diagnostic.tar.gz" -C "$RUNNER_TEMP/evidence" .
          openssl enc -aes-256-cbc -salt -pbkdf2 -in "$RUNNER_TEMP/diagnostic.tar.gz" -out "$RUNNER_TEMP/diagnostic.enc" -pass env:EXPORT_PASSWORD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spinbounce-encrypted-host-diagnostic
          path: ${{ runner.temp }}/diagnostic.enc
          retention-days: 1
          if-no-files-found: error
